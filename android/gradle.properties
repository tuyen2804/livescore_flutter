org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Tắt biên dịch tăng dần của Kotlin: trên Windows nó hay hỏng cache
# (`Could not close incremental caches`) khi build plugin Firebase.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false

# cronet-api và cronet-shared (đi kèm play-services-cronet của cronet_http)
# cùng khai báo namespace `org.chromium.net`; AGP mặc định coi đó là lỗi.
android.uniquePackageNames=false
