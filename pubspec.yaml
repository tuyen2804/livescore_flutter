name: live_score
description: "Live Score — Flutter port (Clean Architecture + Provider)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Dependency injection
  get_it: ^8.0.3

  # Network
  dio: ^5.7.0
  # Sofascore chặn theo dấu vân tay TLS của dart:io (403 với MỌI header).
  # Adapter này đẩy request qua Cronet (Android) / NSURLSession (iOS) nên đi
  # lọt đúng như OkHttp của bản Kotlin.
  native_dio_adapter: ^1.3.0
  connectivity_plus: ^6.1.0

  # Local storage
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5

  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.3
  flutter_svg: ^2.0.16
  smooth_page_indicator: ^1.2.0
  pull_to_refresh_flutter3: ^2.0.2

  # Quảng cáo — bọc com.google.android.gms.ads / GADMobileAds, đúng SDK mà
  # bản Kotlin dùng cho interstitial, app-open, reward và banner.
  google_mobile_ads: ^9.1.0

  # Firebase (giữ theo yêu cầu)
  firebase_core: ^3.8.0
  firebase_analytics: ^11.3.5
  firebase_crashlytics: ^4.1.5
  firebase_remote_config: ^5.1.5

  # Notification (giữ theo yêu cầu)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  permission_handler: ^11.3.1

  # Misc
  intl: ^0.20.2
  equatable: ^2.0.7
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.1
  share_plus: ^10.1.2
  webview_flutter: ^4.10.0
  collection: ^1.18.0
  cupertino_icons: ^1.0.8
  in_app_purchase: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  # Tắt Swift Package Manager: mediation pod kéo Google-Mobile-Ads-SDK qua
  # CocoaPods, nếu google_mobile_ads đi SPM thì app nhúng 2 bản SDK và adapter
  # mediation có thể không gắn được. Để mọi plugin iOS đi chung CocoaPods.
  config:
    enable-swift-package-manager: false

  assets:
    - assets/images/
    - assets/lottie/
    - assets/icons/
    - assets/db/
    - assets/config/

  fonts:
    - family: Gilroy
      fonts:
        - asset: assets/fonts/svn_gilroy_regular.otf
          weight: 400
        - asset: assets/fonts/svn_gilroy_medium.otf
          weight: 500
        - asset: assets/fonts/svn_gilroy_semibold.otf
          weight: 600
        - asset: assets/fonts/svn_gilroy_bold.otf
          weight: 700
    - family: AppFont
      fonts:
        - asset: assets/fonts/light.ttf
          weight: 300
        - asset: assets/fonts/regular.ttf
          weight: 400
        - asset: assets/fonts/medium.ttf
          weight: 500
        - asset: assets/fonts/semi_bold.ttf
          weight: 600
        - asset: assets/fonts/bold.ttf
          weight: 700
